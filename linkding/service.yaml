apiVersion: v1
kind: Service
metadata:
  labels:
    app: linkding
  name: linkding
  namespace: linkding
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      protocol: TCP
      # Linkding listens on 9090 inside the container
      targetPort: 9090
  selector:
    app: linkding
