apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkding
  namespace: linkding
  labels:
    app: linkding
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - linkding.lab.dobreff.net
      secretName: lab-dobreff-net-tls
  rules:
    - host: linkding.lab.dobreff.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linkding
                port:
                  number: 3000
