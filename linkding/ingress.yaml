apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkding
  namespace: linkding
  labels:
    app: linkding
  # No gethomepage.dev/* annotations — Linkding is listed in homepage ConfigMap
  # services.yaml. Annotations here would create a second (discovered) tile.
spec:
  ingressClassName: traefik
  tls:
    # Same wildcard cert as Homepage — Secret must exist in this namespace
    # (issue-cert.sh copies homepage/lab-dobreff-net-tls → linkding/)
    - hosts:
        - linkding.lab.dobreff.net
      secretName: lab-dobreff-net-tls
  rules:
    - host: linkding.lab.dobreff.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linkding
                port:
                  number: 3000
