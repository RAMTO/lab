apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkding
  namespace: linkding
  labels:
    app: linkding
  annotations:
    # Auto-discover on Homepage dashboard
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Linkding
    gethomepage.dev/description: Bookmark manager
    gethomepage.dev/group: Bookmarks
    gethomepage.dev/icon: linkding.png
spec:
  ingressClassName: traefik
  tls:
    # Same wildcard cert as Homepage — Secret must exist in this namespace
    # (issue-cert.sh copies homepage/lab-dobreff-net-tls → linkding/)
    - hosts:
        - linkding.lab.dobreff.net
      secretName: lab-dobreff-net-tls
  rules:
    - host: linkding.lab.dobreff.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linkding
                port:
                  number: 3000
