apiVersion: apps/v1
kind: Deployment
metadata:
  name: ig-catalog
  namespace: ig-video-catalog
  labels:
    app: ig-catalog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ig-catalog
  template:
    metadata:
      labels:
        app: ig-catalog
    spec:
      # If ghcr.io/ramto/ig-catalog is private, create ghcr-pull and uncomment:
      # imagePullSecrets:
      #   - name: ghcr-pull
      containers:
        - name: ig-catalog
          image: ghcr.io/ramto/ig-catalog:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: CATEGORIES_DIR
              value: /data/categories
            - name: THUMB_CACHE_DIR
              value: /data/thumbs
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: categories
              mountPath: /data/categories
              readOnly: true
            - name: thumbs
              mountPath: /data/thumbs
      volumes:
        - name: categories
          hostPath:
            # Pi NVMe path — adjust if your layout differs
            path: /srv/ig-videos/categories
            type: Directory
        - name: thumbs
          persistentVolumeClaim:
            claimName: ig-catalog-thumbs
