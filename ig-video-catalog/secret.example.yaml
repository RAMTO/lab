# Do not commit real cookies. Prefer:
#   kubectl -n ig-video-catalog create secret generic ig-cookies \
#     --from-file=cookies.txt=/path/to/ig-video-catalog/downloader/cookies.txt \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Export cookies on the Mac (see ig-video-catalog/downloader README), then copy or recreate on the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: ig-cookies
  namespace: ig-video-catalog
  labels:
    app: ig-downloader
type: Opaque
stringData:
  cookies.txt: |
    # REPLACE — use kubectl create --from-file instead of applying this placeholder
