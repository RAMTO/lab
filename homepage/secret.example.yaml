# Do not commit a real key. Create with:
#   kubectl -n homepage create secret generic homepage-secrets \
#     --from-literal=coingecko-api-key='YOUR_KEY'
#
# CoinGecko Demo key → header x-cg-demo-api-key (default in services.yaml)
# CoinGecko Pro key  → use x-cg-pro-api-key + https://pro-api.coingecko.com/api/v3/...
apiVersion: v1
kind: Secret
metadata:
  name: homepage-secrets
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
type: Opaque
stringData:
  coingecko-api-key: "REPLACE_ME"
