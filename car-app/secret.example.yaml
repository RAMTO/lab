# Do not commit real keys. Create with:
#   kubectl -n car-app create secret generic car-app-secrets \
#     --from-literal=VINCARIO_API_KEY='...' \
#     --from-literal=VINCARIO_SECRET_KEY='...'
#
# Or copy this file to secret.yaml (gitignored) and kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: car-app-secrets
  namespace: car-app
  labels:
    app: car-app
type: Opaque
stringData:
  VINCARIO_API_KEY: "REPLACE_ME"
  VINCARIO_SECRET_KEY: "REPLACE_ME"
