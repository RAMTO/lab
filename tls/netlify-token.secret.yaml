# Create a Netlify Personal Access Token:
#   https://app.netlify.com/user/applications#personal-access-tokens
# Needs permission to manage DNS for dobreff.net.
#
# Then:
#   kubectl create namespace cert-manager --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n cert-manager create secret generic netlify-api-token \
#     --from-literal=token='YOUR_NETLIFY_TOKEN' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# This file is a template only — do not commit a real token.
apiVersion: v1
kind: Secret
metadata:
  name: netlify-api-token
  namespace: cert-manager
type: Opaque
stringData:
  token: "REPLACE_WITH_NETLIFY_PERSONAL_ACCESS_TOKEN"
