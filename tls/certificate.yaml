# Wildcard cert for the lab; cert-manager writes Secret homepage/lab-dobreff-net-tls
# Covers lab.dobreff.net and *.lab.dobreff.net (one Secret for all app Ingresses)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-dobreff-net
  namespace: homepage
spec:
  secretName: lab-dobreff-net-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - lab.dobreff.net
    - "*.lab.dobreff.net"
