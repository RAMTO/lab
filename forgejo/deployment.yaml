apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app: forgejo
spec:
  replicas: 1
  # RWO PVC: avoid two pods mounting the same volume during rollouts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:17.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            # Public URL behind Traefik TLS (Forgejo env → app.ini [server]).
            - name: FORGEJO__server__ROOT_URL
              value: https://git.lab.dobreff.net/
            - name: FORGEJO__server__DOMAIN
              value: git.lab.dobreff.net
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - mountPath: /data
              name: forgejo-data
      volumes:
        - name: forgejo-data
          persistentVolumeClaim:
            claimName: forgejo-data
