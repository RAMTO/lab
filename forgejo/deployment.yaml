apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app: forgejo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:17.0.1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            # Official image stores DB, repos, and config under /data (not /etc/forgejo/data).
            - mountPath: /data
              name: forgejo-data
      volumes:
        - name: forgejo-data
          persistentVolumeClaim:
            claimName: forgejo-data
