apiVersion: apps/v1
kind: Deployment
metadata:
  name: yt-transcribe
  namespace: yt-transcribe
  labels:
    app: yt-transcribe
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: yt-transcribe
  template:
    metadata:
      labels:
        app: yt-transcribe
    spec:
      # If ghcr.io/ramto/yt-transcript is private, create a dockerconfigjson secret and set:
      # imagePullSecrets:
      #   - name: ghcr-pull
      containers:
        - name: yt-transcribe
          image: ghcr.io/ramto/yt-transcript:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: STATIC_DIR
              value: /app/static
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
