apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yt-transcribe
  namespace: yt-transcribe
  labels:
    app: yt-transcribe
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - yt-transcribe.lab.dobreff.net
      secretName: lab-dobreff-net-tls
  rules:
    - host: yt-transcribe.lab.dobreff.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yt-transcribe
                port:
                  number: 8000
